id: b0bot_daily_threat_briefing
namespace: b0bot
description: Pulls 10 recent articles, generates a digest, and emails the user.
labels:
  project: b0bot
  stage: briefing

triggers:
  - id: daily_at_08_utc
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

tasks:
  - id: load_recent_articles
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://postgres:5432/kestra"
    username: "kestra"
    password: "k3str4"
    fetchType: FETCH
    sql: |
      SELECT headline, source_url, category, severity
      FROM articles_metadata
      ORDER BY id DESC LIMIT 10;

  - id: format_articles
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: python:3.11-slim
    env:
      ROWS: "{{ outputs.load_recent_articles.rows | default([]) | toJson }}"
    beforeCommands:
      - pip install --quiet kestra
    commands:
      - python format.py
    inputFiles:
      format.py: |
        import json, os
        from kestra import Kestra
        rows = json.loads(os.environ.get("ROWS", "[]"))
        if not rows:
            Kestra.outputs({"digest_input": "(no articles in the last 24h)", "count": 0})
        else:
            lines = [f"- [{r.get('category','?')}] {r.get('headline','')} (src={r.get('source_url','')})" for r in rows]
            Kestra.outputs({"digest_input": "\n".join(lines), "count": len(rows)})

  - id: gemini_briefing
    type: io.kestra.plugin.ai.agent.AIAgent
    allowFailure: true
    systemMessage: |
      Produce a daily cybersecurity briefing in plain English. 
      Keep it under 400 words and end with a one-line "Recommended actions" bullet.
      Format the output using basic HTML tags (<p>, <ul>, <li>, <strong>) so it renders cleanly in an email.
    prompt: |
      Articles from the last 24h:
      {{ outputs.format_articles.vars.digest_input }}
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-2.5-flash-lite
      apiKey: "{{ envs.gemini_api_key ?? '' }}"

  - id: groq_fallback_briefing
    type: io.kestra.plugin.scripts.python.Script
    runIf: "{{ tasks.gemini_briefing.state == 'FAILED' }}"
    containerImage: python:3.11-slim
    env:
      DIGEST_INPUT: "{{ outputs.format_articles.vars.digest_input }}"
      GROQ_API_KEY: "{{ envs.groq_api_key ?? '' }}"
    beforeCommands:
      - pip install --quiet groq==0.11.0 kestra
    script: |
      import os
      from groq import Groq
      from kestra import Kestra

      digest_input = os.environ.get("DIGEST_INPUT", "")
      client = Groq(api_key=os.environ.get("GROQ_API_KEY", ""))
      completion = client.chat.completions.create(
          model="llama-3.1-8b-instant",
          messages=[{"role": "user", "content": f"Write a daily cyber threat briefing from these articles. Use basic HTML tags (<p>, <ul>, <li>, <strong>): {digest_input}"}]
      )
      Kestra.outputs({"textOutput": completion.choices[0].message.content})

  - id: send_email_digest
    type: io.kestra.plugin.email.MailSend
    runIf: "{{ outputs.format_articles.vars.count > 0 }}"
    host: "{{ envs.smtp_host ?? 'smtp.gmail.com' }}"
    port: "{{ envs.smtp_port ?? '465' }}"
    username: "{{ envs.smtp_username ?? '' }}"
    password: "{{ envs.smtp_password ?? '' }}"
    from: "{{ envs.smtp_username ?? 'b0bot@example.com' }}"
    to: "{{ envs.target_email ?? '' }}"
    subject: "B0bot Daily Threat Intelligence Briefing"
    transportStrategy: SMTPS
    htmlTextContent: |
      <h2>Daily Threat Briefing</h2>
      {{ tasks.gemini_briefing.state == 'FAILED' ? outputs.groq_fallback_briefing.textOutput : outputs.gemini_briefing.textOutput }}
      <br>
      <hr>
      <p><small>Generated by B0bot on Kestra.</small></p>

outputs:
  - id: article_count
    type: INT
    value: "{{ outputs.format_articles.vars.count | default(0) }}"